[package]
name = "viewer-worker"
version.workspace = true
edition.workspace = true
description = "NFT Viewer Worker - serves collections from R2 with optional token-based access"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Internal crates
viewer-format = { path = "../crates/format" }

# Cloudflare Workers
worker = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
futures = "0.3"
futures-util = "0.3"

# Panic handling
console_error_panic_hook = "0.1"
