[package]
name = "viewer-worker"
version.workspace = true
edition.workspace = true
description = "NFT Viewer Worker - serves collections from R2 with optional token-based access"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Internal crates
viewer-format = { path = "../crates/format" }
viewer-binary = { path = "../crates/binary" }

# Cloudflare Workers (via worker_stack facade)
worker = "=0.7.4"
worker_stack = { workspace = true }
worker_utils = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
futures = "0.3"
futures-util = "0.3"
