name = "preview-viewer"
main = "build/worker/shim.mjs"
compatibility_date = "2025-08-31"
routes = [
    { pattern = "preview.compositor.hodlcroft.com", custom_domain = true },
]

[observability]
enabled = true

# Build configuration
[build]
command = "./build.sh"

[[kv_namespaces]]
id = "fadcdcfa00cc473ab004209640a83685"
binding = "CACHE"

# R2 bucket for compositor generated collections
[[r2_buckets]]
binding = "COMPOSITOR_BUCKET"
bucket_name = "hodlcroft-compositor"

# Static assets configuration for frontend
[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only run worker for API and health routes, let static assets handle the rest
run_worker_first = ["/api/*", "/health"]
