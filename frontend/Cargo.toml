[package]
name = "viewer-frontend"
version = "0.1.0"
edition = "2021"
description = "Leptos frontend for the NFT viewer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal crates
viewer-binary = { path = "../crates/binary" }

# Leptos framework (CSR mode)
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"
leptos_router = "0.8"

# UI utilities from shared-ui
ui-core = { git = "https://github.com/defrag-au/shared-ui", rev = "24cc859" }

# WebSocket + WASM
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "History",
    "Location",
    "Storage",
    "UrlSearchParams",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRectReadOnly",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
js-sys = "*"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# HTTP client for API calls
gloo-net = "0.6"

# Async utilities
futures = "0.3"

# Timers for delayed callbacks
gloo-timers = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# URL encoding
urlencoding = "2"
base64 = "0.22.1"

# Rarity scoring
asset-rarity = { path = "/Users/damo/code/defrag/shared-crates/asset-rarity" }

# Wallet integration (Cardano CIP-30)
wallet-leptos = { path = "/Users/damo/code/defrag/shared-crates/ui/wallet-leptos" }
wallet-pallas = { path = "/Users/damo/code/defrag/shared-crates/ui/wallet-pallas" }
wallet-core = { path = "/Users/damo/code/defrag/shared-crates/ui/wallet-core" }
