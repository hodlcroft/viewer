[package]
name = "viewer-frontend"
version.workspace = true
edition = "2024"
description = "Leptos frontend for the NFT viewer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal crates
viewer-binary.workspace = true

# Leptos framework (CSR mode)
leptos = { workspace = true, features = ["csr"] }
leptos_meta.workspace = true
leptos_router.workspace = true

# UI utilities from shared-ui
ui-core.workspace = true

# Web APIs
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "History",
    "Location",
    "Storage",
    "UrlSearchParams",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRectReadOnly",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

# HTTP client for API calls
gloo-net.workspace = true

# Async utilities
futures.workspace = true

# Timers for delayed callbacks
gloo-timers.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Logging
tracing.workspace = true

# URL encoding
urlencoding.workspace = true
base64.workspace = true

# Rarity scoring
asset-rarity.workspace = true

# Wallet integration (Cardano CIP-30)
wallet-leptos.workspace = true
wallet-pallas.workspace = true
wallet-core.workspace = true
