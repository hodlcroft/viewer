[workspace]
resolver = "2"
members = [
    "crates/format",
    "crates/bundle",
    "crates/cli",
    "worker",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hodlcroft/viewer"

[workspace.dependencies]
# Internal crates
viewer-format = { path = "crates/format" }
viewer-bundle = { path = "crates/bundle" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image processing
image = "0.25"

# WASM/Frontend
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
web-sys = "0.3"
wasm-bindgen = "0.2"
gloo-timers = "0.3"
js-sys = "0.3"

# shared-crates
worker_utils = { git = "https://github.com/defrag-au/shared-crates", package = "worker_utils", rev = "2d68fcc" }
worker_stack = { git = "https://github.com/defrag-au/shared-crates", package = "worker_stack", rev = "2d68fcc" }
test_utils = { git = "https://github.com/defrag-au/shared-crates", package = "test_utils", rev = "2d68fcc" }
cnft-tools = { git = "https://github.com/defrag-au/shared-crates", package = "cnft-tools", rev = "2d68fcc" }
