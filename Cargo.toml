[workspace]
resolver = "2"
members = [
    "crates/format",
    "crates/bundle",
    "crates/binary",
    "crates/ingest",
    "crates/cli",
    "worker",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hodlcroft/viewer"

[workspace.dependencies]
# Internal crates
viewer-format = { path = "crates/format" }
viewer-bundle = { path = "crates/bundle" }
viewer-binary = { path = "crates/binary" }
viewer-ingest = { path = "crates/ingest" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Image processing
image = "0.25"

# WASM/Frontend
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
web-sys = "0.3"
wasm-bindgen = "*"
gloo-timers = "0.3"
js-sys = "0.3"

# shared-crates (all pinned to same rev)
worker_utils = { git = "https://github.com/defrag-au/shared-crates", package = "worker_utils", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
worker_stack = { git = "https://github.com/defrag-au/shared-crates", package = "worker_stack", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
test_utils = { git = "https://github.com/defrag-au/shared-crates", package = "test_utils", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
cnft_tools = { git = "https://github.com/defrag-au/shared-crates", package = "cnft_tools", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
cardano-assets = { git = "https://github.com/defrag-au/shared-crates", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
asset-rarity = { git = "https://github.com/defrag-au/shared-crates", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
wallet-leptos = { git = "https://github.com/defrag-au/shared-crates", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
wallet-pallas = { git = "https://github.com/defrag-au/shared-crates", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }
wallet-core = { git = "https://github.com/defrag-au/shared-crates", rev = "029ac72caecc73abe7a2d2dc0ce0b4164a0a51d5" }

# shared-ui (for ui-core)
ui-core = { git = "https://github.com/defrag-au/shared-ui", rev = "24cc859" }

# Frontend-specific
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"
futures = "0.3"
urlencoding = "2"
base64 = "0.22.1"

# Local overrides for development
[patch."https://github.com/defrag-au/shared-crates"]
