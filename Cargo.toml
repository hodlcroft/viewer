[workspace]
resolver = "2"
members = [
    "crates/format",
    "crates/bundle",
    "crates/binary",
    "crates/ingest",
    "crates/cli",
    "worker",
]
exclude = [
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hodlcroft/viewer"

[workspace.dependencies]
# Internal crates
viewer-format = { path = "crates/format" }
viewer-bundle = { path = "crates/bundle" }
viewer-binary = { path = "crates/binary" }
viewer-ingest = { path = "crates/ingest" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Image processing
image = "0.25"

# WASM/Frontend
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
web-sys = "0.3"
wasm-bindgen = "*"
gloo-timers = "0.3"
js-sys = "0.3"

# shared-crates (all pinned to same rev)
worker_utils = { git = "https://github.com/defrag-au/shared-crates", package = "worker_utils", rev = "f750432" }
worker_stack = { git = "https://github.com/defrag-au/shared-crates", package = "worker_stack", rev = "f750432" }
test_utils = { git = "https://github.com/defrag-au/shared-crates", package = "test_utils", rev = "f750432" }
cnft_tools = { git = "https://github.com/defrag-au/shared-crates", package = "cnft_tools", rev = "f750432" }
cardano-assets = { git = "https://github.com/defrag-au/shared-crates", rev = "f750432" }

# Local overrides for development
[patch."https://github.com/defrag-au/shared-crates"]
# cnft_tools = { path = "/Users/damo/code/defrag/shared-crates/cnft-tools" }
cardano-assets = { path = "/Users/damo/code/defrag/shared-crates/cardano-assets" }
